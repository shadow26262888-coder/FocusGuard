name: Android CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle Wrapper
      run: gradle wrapper
      working-directory: FocusGuard/FocusGuard

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: FocusGuard/FocusGuard

    - name: Build APK
      run: ./gradlew assembleDebug
      working-directory: FocusGuard/FocusGuard

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: FocusGuard/FocusGuard/app/build/outputs/apk/debug/app-debug.apk
